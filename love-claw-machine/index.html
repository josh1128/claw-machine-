<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff2f4" />
  <meta name="description" content="A little claw machine full of love, made for Elina." />
  <title>Elina's Love Claw Machine 💗</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div class="background-hearts" aria-hidden="true">♡ ✧ ♡ ✧ ♡</div>
  <main class="app">
    <header class="intro">
      <h1>Elina's <span>Love Arcade</span></h1>
      <p>One special surprise is waiting for you. Catch a mystery box to open it. 💌</p>
    </header>

    <div class="layout">
      <section class="machine-wrap" aria-label="Interactive claw machine">
        <div class="machine">
          <div class="machine-header"><span>♡</span> LOVE CLAW <span>♡</span></div>
          <div class="window" id="window">
            <div class="sparkles" aria-hidden="true">✦ <span>✧</span> ✦</div>
            <div class="rail"></div>
            <div class="claw-assembly" id="claw" style="left:50%;--drop:0px">
              <div class="cable"></div>
              <div class="claw-head"><i></i><i></i><i></i></div>
              <div class="claw-prongs"><span></span><span></span></div>
            </div>
            <div class="prize mystery-capsule" style="--x:14%;--y:69%;--delay:0s" data-capsule="0"><div class="toy">🎁</div><span>?</span></div>
            <div class="prize mystery-capsule" style="--x:28.5%;--y:78%;--delay:-0.6s" data-capsule="1"><div class="toy">🎁</div><span>?</span></div>
            <div class="prize mystery-capsule" style="--x:43%;--y:67%;--delay:-1.2s" data-capsule="2"><div class="toy">🎁</div><span>?</span></div>
            <div class="prize mystery-capsule" style="--x:57%;--y:78%;--delay:0s" data-capsule="3"><div class="toy">🎁</div><span>?</span></div>
            <div class="prize mystery-capsule" style="--x:71.5%;--y:69%;--delay:-0.6s" data-capsule="4"><div class="toy">🎁</div><span>?</span></div>
            <div class="prize mystery-capsule" style="--x:86%;--y:78%;--delay:-1.2s" data-capsule="5"><div class="toy">🎁</div><span>?</span></div>
            <div class="window-floor"></div>
          </div>
          <div class="machine-panel">
            <div class="panel-label"><span>✦</span> MYSTERY MODE <span>✦</span></div>
            <div class="game-controls">
              <button class="arrow" id="left" aria-label="Move claw left">←</button>
              <button class="grab" id="grab">GRAB! <span>♡</span></button>
              <button class="arrow" id="right" aria-label="Move claw right">→</button>
            </div>
            <div class="panel-foot"><div class="slot">♥ ♥ ♥</div><div class="chute">PRIZE <span>↓</span></div><div class="coin">♡</div></div>
          </div>
          <div class="machine-base"></div>
        </div>
        <p class="hint" id="status" role="status" aria-live="polite" hidden></p>
        <button id="read-again" class="read-again" hidden>💌 Read your letter again</button>
      </section>

    </div>
    <footer>made just for you ♡</footer>
  </main>

  <dialog id="win-dialog" aria-labelledby="win-title">
    <div class="modal-content letter-modal">
      <button class="close" id="close-dialog" aria-label="Close letter">×</button>
      <p class="modal-top">✧ A LETTER JUST FOR YOU ✧</p>
      <div class="won-emoji">💌</div>
      <h2 id="win-title">For Elina, with love</h2>
      <div class="love-letter" id="love-letter"></div>
      <p class="letter-signoff">Love, Josh ♡</p>
      <button class="play-again" id="play-again">Keep this in your heart ♡</button>
    </div>
  </dialog>
  <div id="confetti" aria-hidden="true"></div>
</body>
</html>
